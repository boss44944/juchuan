<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Juchuan 菊传</title>
<link rel="stylesheet" href="/static/style.css?v=20260728a">
</head>
<body>
<div class="bg-blur bg-a"></div>
<div class="bg-blur bg-b"></div>

<main id="loginView" class="login-shell">
	<form id="loginForm" class="login-card">
		<div class="brand-logo" aria-hidden="true">JC</div>
		<h1>Juchuan 菊传</h1>
		<img id="loginQr" alt="访问地址二维码">
		<input id="loginPassword" type="password" placeholder="请输入访问密码" required>
		<button id="loginBtn" type="submit">确定</button>
		<p id="loginError" class="error"></p>
	</form>
</main>

<main id="appView" class="app-shell" hidden>
	<header class="app-head">
		<h2>Juchuan 菊传</h2>
		<button id="logoutBtn" class="ghost">退出</button>
	</header>

	<nav class="tabs">
		<button class="tab is-active" data-tab="send">发送</button>
		<button class="tab" data-tab="history">历史</button>
		<button class="tab" data-tab="device">设备</button>
	</nav>

	<section id="panel-send" class="panel tab-panel is-active">
		<div class="home-grid">
			<article class="card">
				<h3>发送文字</h3>
				<textarea id="text" placeholder="输入需要发送的文字或链接"></textarea>
				<button id="sendTextBtn">发送文字</button>
				<p id="textStatus" class="hint"></p>
			</article>

			<article class="card">
				<h3>上传文件</h3>
				<label class="upload-drop" for="file">
					<input id="file" type="file">
					<span>点击选择文件，或将文件拖拽到此处</span>
				</label>
				<p id="uploadStatus" class="hint"></p>
			</article>
		</div>
	</section>

	<section id="panel-history" class="panel tab-panel">
		<div class="panel-head">
			<h3>传输历史</h3>
			<button id="refreshHistoryBtn" class="ghost">刷新</button>
		</div>
		<div id="history" class="history-list"></div>
	</section>

	<section id="panel-device" class="panel tab-panel">
		<div class="device-grid">
			<article class="card">
				<h3>访问地址</h3>
				<div class="url-row">
					<a id="addressLink" target="_blank" rel="noreferrer"></a>
					<button id="copyUrlBtn" class="ghost">复制</button>
				</div>
			</article>

			<article class="card qr-panel">
				<h3>扫码访问</h3>
				<img id="qrImage" alt="访问地址二维码">
			</article>
		</div>

		<article class="card">
			<h3>在线设备</h3>
			<div id="devices" class="device-list"></div>
		</article>
	</section>
</main>
<script src="/static/script.js?v=20260728a"></script>
</body>
</html>
